# .pre-commit-config.yaml, run by prek (`prek install`): the `builtin` hooks below are
# prek's own and need no download; pre-commit itself does not know them.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # Hygiene (prek built-ins, offline)
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
        args: [--allow-multiple-documents]   # deploy/k8s manifests
      - id: check-toml
      - id: check-json
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # Secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1              # `prek update` bumps this
    hooks:
      - id: gitleaks

  # Conventional commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, refactor, perf, test, docs, build, ci, style, chore, revert]

  # GitHub Actions workflows
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Repository setup policy: the rules in .fleetlint.yaml, on every commit
  - repo: local
    hooks:
      - id: fleetlint
        name: fleetlint (repository setup)
        entry: fleetlint check --fail-on error --color=false
        language: system
        pass_filenames: false
        always_run: true

  # Full gate before push (calls the task runner's `check` target)
  - repo: local
    hooks:
      - id: check
        name: full check (lint, tests, coverage, audit, build)
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # proto
  - repo: local
    hooks:
      - id: buf-lint
        name: buf lint
        entry: make proto-lint
        language: system
        files: ^api/proto/
        pass_filenames: false

  # web hooks (tools pinned by web/package-lock.json)
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd web && npx --no-install prettier --check .'
        language: system
        files: ^web/
        pass_filenames: false
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd web && npx --no-install eslint .'
        language: system
        files: ^web/.*\.(js|ts|svelte)$
        pass_filenames: false

  # go hooks
  - repo: local
    hooks:
      - id: golangci-fmt
        name: golangci-lint fmt
        entry: golangci-lint fmt
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint (new issues only)
        entry: golangci-lint run --new-from-rev=HEAD --fix
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy is clean
        entry: go mod tidy -diff
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false
