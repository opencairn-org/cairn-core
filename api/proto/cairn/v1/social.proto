// Reads across users: the home feed today; following feed, clubs, profiles,
// shared and projected activities next. Non-owner activities are projected
// through the visibility model (ProjectedActivity), never served in full.
syntax = "proto3";

package cairn.v1;

import "cairn/v1/activity.proto";
import "cairn/v1/common.proto";
import "google/protobuf/timestamp.proto";

service SocialService {
  // The logged-in landing feed: the caller's own activities, the local
  // following feed (projected) and federated activities from followed remote
  // actors, merged newest first.
  // Scope: social:read.
  rpc ListHomeFeed(ListHomeFeedRequest) returns (ListHomeFeedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The local following feed alone: friends on this server, projected
  // (GET /api/feed/following).
  // Scope: social:read.
  rpc ListFollowingFeed(ListFollowingFeedRequest) returns (ListFollowingFeedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Public clubs plus the caller's own (GET /api/clubs).
  // Scope: social:read.
  rpc ListClubs(ListClubsRequest) returns (ListClubsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A club with the caller's membership; a private club is PermissionDenied
  // to non-members (GET /api/clubs/{slug}).
  // Scope: social:read.
  rpc GetClub(GetClubRequest) returns (GetClubResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Members of a club the caller may see (GET /api/clubs/{slug}/members).
  // Scope: social:read.
  rpc ListClubMembers(ListClubMembersRequest) returns (ListClubMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Member activities of a club, projected per the visibility model
  // (GET /api/clubs/{slug}/feed).
  // Scope: social:read.
  rpc ListClubFeed(ListClubFeedRequest) returns (ListClubFeedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // An athlete profile with recent projected activities; a non-public
  // profile is PermissionDenied unless the caller follows the owner
  // (GET /api/profiles/{username}).
  // Scope: social:read.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Someone else's activity as the caller may see it; PermissionDenied when
  // nothing is shared (GET /api/activities/{id}/projected).
  // Scope: social:read.
  rpc GetProjectedActivity(GetProjectedActivityRequest) returns (GetProjectedActivityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // An activity behind a share link; the token is the authorization, no
  // credential needed (GET /api/shared/{token}).
  // Scope: none (public).
  rpc GetSharedActivity(GetSharedActivityRequest) returns (GetSharedActivityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The caller's activities the matcher flagged for review
  // (GET /api/review-queue).
  // Scope: activities:read.
  rpc ListReviewQueue(ListReviewQueueRequest) returns (ListReviewQueueResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// An activity as a non-owner may see it. The summary tier is always present;
// every richer field only when its visibility category is granted, which
// visible_categories lists (domain order).
message ProjectedActivity {
  string id = 1;
  string title = 2;
  ActivityType type = 3;
  string discipline = 4;
  google.protobuf.Timestamp start_time = 5;
  string timezone = 6;
  int64 elapsed_duration_s = 7;
  int64 moving_duration_s = 8;
  optional double distance_m = 9;
  optional double elevation_gain_m = 10;
  // Category "summary".
  string description = 11;
  optional double tss = 12;
  optional int32 calories = 13;
  // Category "location". start_location_redacted: the start lies inside one
  // of the owner's privacy zones, so place and coordinates are withheld even
  // though the category is granted.
  string start_place = 14;
  optional GeoPoint start = 15;
  bool start_location_redacted = 16;
  // Categories "hr", "power", "pace_speed".
  optional int32 avg_hr = 17;
  optional int32 max_hr = 18;
  optional int32 avg_power = 19;
  optional int32 max_power = 20;
  optional int32 normalized_power = 21;
  optional double avg_speed_mps = 22;
  optional double max_speed_mps = 23;
  // Category "map": the privacy-zone trimmed course image. Category
  // "photos": has_photos says ListAttachments will answer.
  ContentUrl map_image = 24;
  bool has_photos = 25;
  repeated string visible_categories = 26;
}

// An activity received from a followed remote ActivityPub actor.
message FederatedActivity {
  // The remote object id (a URL).
  string id = 1;
  string title = 2;
  // Free-form sport name as the remote server sent it.
  string sport = 3;
  google.protobuf.Timestamp start_time = 4;
  string summary = 5;
  // The remote page of the activity.
  string url = 6;
  // The remote image, as sent (not signed by this server).
  ContentUrl map_image = 7;
  optional double distance_m = 8;
  optional double elevation_gain_m = 9;
  optional int64 elapsed_duration_s = 10;
}

message FeedItem {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_SELF = 1;
    SOURCE_FOLLOWING = 2;
    SOURCE_FEDERATED = 3;
  }
  Source source = 1;
  UserCard owner = 2;
  oneof item {
    Activity own = 3;
    ProjectedActivity projected = 4;
    FederatedActivity federated = 5;
  }
}

message ListHomeFeedRequest {
  // limit default 30, max 100.
  PageRequest page = 1;
}
message ListHomeFeedResponse {
  repeated FeedItem items = 1;
  PageResponse page = 2;
}

message ListFollowingFeedRequest {
  // limit default 30, max 100.
  PageRequest page = 1;
}
message ListFollowingFeedResponse {
  // Every item has source SOURCE_FOLLOWING.
  repeated FeedItem items = 1;
  PageResponse page = 2;
}

message ClubCard {
  string id = 1;
  string slug = 2;
  string name = 3;
  bool is_public = 4;
  int32 member_count = 5;
  google.protobuf.Timestamp created_at = 6;
}
message ListClubsRequest {
  // limit default 50, max 200.
  PageRequest page = 1;
}
message ListClubsResponse {
  repeated ClubCard clubs = 1;
  PageResponse page = 2;
}
message GetClubRequest {
  string slug = 1;
}
message GetClubResponse {
  ClubCard club = 1;
  string description = 2;
  bool is_member = 3;
  // owner | admin | member, empty when not a member.
  string my_role = 4;
}
message ListClubMembersRequest {
  string slug = 1;
  // limit default 200.
  PageRequest page = 2;
}
message ClubMember {
  UserCard user = 1;
  string role = 2;
}
message ListClubMembersResponse {
  repeated ClubMember members = 1;
  PageResponse page = 2;
}
message ListClubFeedRequest {
  string slug = 1;
  // limit default 30, max 100.
  PageRequest page = 2;
}
message ListClubFeedResponse {
  // Projected rows (or the caller's own activities in full).
  repeated FeedItem items = 1;
  PageResponse page = 2;
}

message GetProfileRequest {
  string username = 1;
}
message GetProfileResponse {
  UserCard user = 1;
  bool is_public = 2;
  bool is_self = 3;
  bool is_following = 4;
  int32 followers_count = 5;
  int32 following_count = 6;
  // The 20 newest activities the caller may see, projected.
  repeated ProjectedActivity activities = 7;
}

message GetProjectedActivityRequest {
  string activity_id = 1;
}
message GetProjectedActivityResponse {
  ProjectedActivity activity = 1;
  UserCard owner = 2;
  bool is_owner = 3;
}

message GetSharedActivityRequest {
  string token = 1;
}
message GetSharedActivityResponse {
  ProjectedActivity activity = 1;
  UserCard owner = 2;
}

message ListReviewQueueRequest {}
message ReviewItem {
  string id = 1;
  string title = 2;
  ActivityType type = 3;
  google.protobuf.Timestamp start_time = 4;
  // The matcher's confidence band that flagged the activity.
  string match_confidence = 5;
}
message ListReviewQueueResponse {
  repeated ReviewItem items = 1;
}
