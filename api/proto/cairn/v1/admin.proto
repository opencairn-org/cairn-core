// Webhook signing tokens (per external account)
// ============================================================================

message WebhookSigningTokenInfo {
  string external_account_id = 1;
  string user_id = 2;
  string provider = 3;
  google.protobuf.Timestamp last_rotated_at = 4;
  optional google.protobuf.Timestamp last_used_at = 5;
}

message ListWebhookSigningTokensRequest {
  optional string provider = 1;
  PageRequest page = 2;
}
message ListWebhookSigningTokensResponse {
  repeated WebhookSigningTokenInfo tokens = 1;
  PageResponse page = 2;
}

message BulkRotateWebhookSigningTokensRequest {
  // Selectors — at least one must be set. Selectors compose with AND.
  optional string provider = 1;
  // If true, rotate tokens that haven't been rotated in this period.
  optional google.protobuf.Duration older_than = 2;
  // Explicit list of external_account_ids to rotate.
  repeated string external_account_ids = 3;
}
message BulkRotateWebhookSigningTokensResponse {
  int32 rotated_count = 1;
  // One entry per rotated account. The job ids stay empty until a worker
  // consumes the signing token and the subscription has to be re-registered.
  repeated WebhookRotationJobs rotation_jobs = 2;
}
message WebhookRotationJobs {
  string external_account_id = 1;
  string unregister_job_id = 2;
  string register_job_id = 3;
}

// ============================================================================
// System health
// ============================================================================

message GetSystemHealthRequest {}
message GetSystemHealthResponse {
  // Overall summary.
  HealthState overall = 1;

  // Per-subsystem.
  ComponentHealth database = 2;
  ComponentHealth queue = 3;
  ComponentHealth storage = 4;
  ComponentHealth email = 5;

  // Worker fleet at a glance.
  int32 workers_healthy = 6;
  int32 workers_degraded = 7;
  int32 workers_offline = 8;

  // Queue depth.
  int32 jobs_queued = 9;
  int32 jobs_running = 10;
  int32 jobs_dead_letter = 11;

  // Error rate over the last 15 minutes (fraction 0..1).
  double error_rate_15m = 12;

  google.protobuf.Timestamp checked_at = 13;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_DEGRADED = 2;
  HEALTH_STATE_UNHEALTHY = 3;
}

message ComponentHealth {
  HealthState state = 1;
  string detail = 2;                 // human-readable, e.g. "78 ms p50, 3 errors/min"
  // Optional structured measurements.
  map<string, double> measurements = 3;
}

// ============================================================================
// Admin event stream
// ============================================================================

message StreamAdminEventsRequest {
  repeated AdminEventType types = 1;
}

enum AdminEventType {
  ADMIN_EVENT_TYPE_UNSPECIFIED = 0;
  ADMIN_EVENT_TYPE_WORKER_REGISTERED = 1;
  ADMIN_EVENT_TYPE_WORKER_DEREGISTERED = 2;
  ADMIN_EVENT_TYPE_WORKER_OFFLINE = 3;
  ADMIN_EVENT_TYPE_WORKER_DEGRADED = 4;
  ADMIN_EVENT_TYPE_PROVIDER_CONFLICT_DETECTED = 5;
  ADMIN_EVENT_TYPE_JOB_DEAD_LETTERED = 6;
  ADMIN_EVENT_TYPE_USER_CREATED = 7;
  ADMIN_EVENT_TYPE_USER_SUSPENDED = 8;
  ADMIN_EVENT_TYPE_AUTH_FLOOD_DETECTED = 9;   // repeated login failures
  ADMIN_EVENT_TYPE_SYSTEM_HEALTH_DEGRADED = 10;
}

message AdminEvent {
  string id = 1;
  AdminEventType type = 2;
  AuditSeverity severity = 3;
  google.protobuf.Timestamp ts = 4;
  // i18n key + params for client-side localization.
  string i18n_key = 5;
  map<string, string> i18n_params = 6;
  // Optional context references.
  optional string user_id = 7;
  optional string worker_name = 8;
  optional string job_id = 9;
}

// ============================================================================
// Maintenance
// ============================================================================

enum MaintenanceOperation {
  MAINTENANCE_OPERATION_UNSPECIFIED = 0;
  // Re-run segment matching across all users' activities. Long-running.
  MAINTENANCE_OPERATION_REMATCH_ALL_SEGMENTS = 1;
  // Recompute best efforts and user records for all activities. Triggered
  // when the best-effort algorithm changes.
  MAINTENANCE_OPERATION_RECOMPUTE_BEST_EFFORTS = 2;
  // Recompute the merged Activity rows from sources. Triggered after a
  // merge-engine update.
  MAINTENANCE_OPERATION_RECOMPUTE_ACTIVITY_MERGES = 3;
  // Recompute daily CTL/ATL/TSB metrics for all users.
  MAINTENANCE_OPERATION_RECOMPUTE_TRAINING_LOAD = 4;
  // Hard-delete activities soft-deleted more than 30 days ago (sources and
  // attachments cascade, their blobs are released).
  MAINTENANCE_OPERATION_PURGE_SOFT_DELETED = 5;
  // Delete objects older than a day that no source or attachment references
  // any more, across every key family they can point at (REST and Connect
  // uploads, worker-stored blobs, attachments, claim-check payloads).
  MAINTENANCE_OPERATION_GARBAGE_COLLECT_BLOBS = 6;
}

enum MaintenanceJobStatus {
  MAINTENANCE_JOB_STATUS_UNSPECIFIED = 0;
  MAINTENANCE_JOB_STATUS_QUEUED = 1;
  MAINTENANCE_JOB_STATUS_RUNNING = 2;
  MAINTENANCE_JOB_STATUS_SUCCEEDED = 3;
  MAINTENANCE_JOB_STATUS_FAILED = 4;
  MAINTENANCE_JOB_STATUS_CANCELLED = 5;
}

message MaintenanceJob {
  string id = 1;
  MaintenanceOperation operation = 2;
  repeated string user_ids = 3;
  MaintenanceJobStatus status = 4;
  // Records the job will touch; -1 while unknown.
  int64 estimated_record_count = 5;
  int64 processed_count = 6;
  int64 failed_count = 7;
  string error_message = 8;
  optional string triggered_by_user_id = 9;
  google.protobuf.Timestamp queued_at = 10;
  optional google.protobuf.Timestamp started_at = 11;
  optional google.protobuf.Timestamp finished_at = 12;
}

message ListMaintenanceJobsRequest {}
message ListMaintenanceJobsResponse {
  // Newest first.
  repeated MaintenanceJob jobs = 1;
}

message CancelMaintenanceJobRequest {
  string job_id = 1;
}
message CancelMaintenanceJobResponse {
  MaintenanceJob job = 1;
}

message TriggerMaintenanceRequest {
  MaintenanceOperation operation = 1;
  // Scope: empty = all users. Else only these users.
  repeated string user_ids = 2;
  // Confirmation phrase the admin must type: the operation name in upper
  // case without the enum prefix, e.g. "REMATCH_ALL_SEGMENTS".
  string confirm_phrase = 3;
}
message TriggerMaintenanceResponse {
  string job_id = 1;
  // Estimated number of records the operation will touch.
  int64 estimated_record_count = 2;
}

