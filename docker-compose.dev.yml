# Cairn dev stack
#
# This file spins up everything the Cairn server + workers + web frontend
# *depend* on but which is NOT part of the source tree:
#
#   * Postgres 17 + TimescaleDB + PostGIS  (data plane)
#   * MinIO                                 (S3-compatible blob store)
#   * NATS 2.14 with JetStream              (worker control plane + job bus)
#
# Explicitly NOT included:
#
#   * cmd/server      — built locally via `make build` / `make run`
#   * cmd/worker-*    — built locally per provider
#   * web/            — run via `npm run dev` / `npm run build` + Node adapter
#
# Every image is pinned to a concrete release tag (no `:latest`) so the
# stack is reproducible — once the images have been pulled the stack
# replays without internet access.
#
# Bring-up:
#
#   docker compose -f docker-compose.dev.yml pull              # once, online
#   docker compose -f docker-compose.dev.yml up -d             # offline-safe afterwards
#   docker compose -f docker-compose.dev.yml ps                # verify health
#   docker compose -f docker-compose.dev.yml logs -f postgres  # tail
#   docker compose -f docker-compose.dev.yml down              # stop (keeps data)
#   docker compose -f docker-compose.dev.yml down -v           # stop + wipe
#
# Then run the binaries on the host (see docs/run-local.md):
#
#   cp dev.env.example dev.env   # connection strings + dev secrets
#   make dev-server              # Go server  (live-reload)
#   make dev-worker              # Strava worker
#   make dev-web                 # SvelteKit dev server (vite HMR)
#
# The server creates the CAIRN_STORAGE_BUCKET on first boot — no bucket-init
# service needed here.

name: cairn-dev

networks:
  cairn:
    name: cairn-dev
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  nats_data:

services:
  # ---------------------------------------------------------------------------
  # Postgres 17 + TimescaleDB + PostGIS
  # ---------------------------------------------------------------------------
  postgres:
    # timescaledb-ha bundles TimescaleDB + PostGIS on Postgres. The pg17-ts2.27
    # tag pins to Postgres 17.9 + TimescaleDB 2.27 — the latest stable as of
    # 2026-05. Bump deliberately when a new minor lands; offline replay needs
    # a concrete tag.
    image: timescale/timescaledb-ha:pg17-ts2.27@sha256:4f61167e11c7c95bedf96433c720d671a53aa29ad7f52b142b529a6d0e9f0b20
    restart: unless-stopped
    networks: [cairn]
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible blob storage for raw FIT/TCX/GPX uploads)
  # ---------------------------------------------------------------------------
  minio:
    # Pinned MinIO server release. The `latest` tag drifts; this one is
    # the most-recent stable RELEASE as of 2026-05.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    networks: [cairn]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cairn
      MINIO_ROOT_PASSWORD: cairn-secret
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # NATS with JetStream, unauthenticated (dev workers connect anonymously).
  # Worker enrollment (auth-callout) uses docker/nats-auth-callout.conf
  # instead — see docs/architecture.md §4.5.
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    restart: unless-stopped
    networks: [cairn]
    # docker/nats.conf sets max_payload: 8MB (no CLI flag exists for it) — long
    # activity streams exceed the 1 MiB default JobResult size. It also enables
    # JetStream + monitoring on :8222.
    command: ["-c", "/etc/nats/nats.conf", "--cluster_name", "cairn-dev"]
    ports:
      - "127.0.0.1:4222:4222"  # client connections
      - "127.0.0.1:8222:8222"  # monitoring
    volumes:
      - nats_data:/data
      # ",z" relabels for SELinux hosts (Fedora + rootless podman); no-op elsewhere.
      - ./docker/nats.conf:/etc/nats/nats.conf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Mailpit — catches outbound SMTP so notification emails are inspectable in a
  # web UI (http://localhost:8025) instead of hitting a real relay.
  # Point the server at it:  CAIRN_EMAIL_SMTP_HOST=localhost CAIRN_EMAIL_SMTP_PORT=1025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.32@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    restart: unless-stopped
    networks: [cairn]
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
