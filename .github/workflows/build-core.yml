name: Build & push core image

# Builds the Cairn core image (docker/Dockerfile.core) with BuildKit and, on a
# successful build, pushes it to the GitHub Container Registry tagged by git tag
# + commit hash. The image is a single DISTROLESS binary (nonroot, no shell)
# that serves both the API and the embedded web SPA — `cairn serve` answers /
# and /api + /cairn.v1.*.
#
# Proto code (gen/) is generated OFFLINE: the check job runs inside the shared
# build-base toolchain image (local buf plugins on PATH, no BSR), and the
# Dockerfile's own `proto` stage (FROM build-base) regenerates it in-image — so
# this workflow needs no setup-go / buf-setup / proto cache.
#
# Registry: ghcr.io/opencairn-org/cairn-core
# Auth: the built-in GITHUB_TOKEN (packages: write) — no extra secret needed.
# Depends on the PUBLIC ghcr.io/opencairn-org/cairn-build-base:1 package (published
# by build-base.yml); a public package pulls without credentials.
#
# Supply chain: pushed images carry BuildKit SLSA provenance + SBOM
# attestations, are signed keyless with cosign (Fulcio cert bound to this
# workflow's OIDC identity, logged in Rekor), and get a GitHub provenance
# attestation (verifiable via `gh attestation verify`). Verify with:
#   cosign verify ghcr.io/opencairn-org/cairn-core:<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       '^https://github.com/opencairn-org/cairn-core/\.github/workflows/build-core\.yml@.*'
#
# Triggers (PRs are gated by check.yml and never reach the registry):
#   - push to the default branch  → publishes  sha-<short>  (+ latest)
#   - push of a v* git tag        → publishes  <tag>  + sha-<short>

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/opencairn-org/cairn-core
  BUILD_BASE: ghcr.io/opencairn-org/cairn-build-base:1

jobs:
  # Gate: `make check` (check.yml) must be green before an image is built.
  check:
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository] -- the documented relative form

  build-push:
    name: Build & push cairn (core)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only build/push once `make check` is green.
    needs: check
    outputs:
      digest: ${{ steps.build.outputs.digest }}   # for the release job
    if: github.event_name == 'push'
    # id-token/attestations only here — the check job stays unprivileged.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enables BuildKit (buildx) for the build below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Derive image tags: the git tag (on tag pushes), the short commit SHA
      # always, and `latest` on the default branch.
      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (BuildKit)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.core
          # Publish only from main or a v* release tag; PRs/feature branches
          # build as a gate but never push to the registry.
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit-level SLSA provenance + SBOM, attached to the image index.
          provenance: mode=max
          sbom: true
          # Surfaced into the binary's build info (-ldflags in the Dockerfile).
          build-args: |
            BUILD_BASE=${{ env.BUILD_BASE }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}

      # Keyless sigstore signing — one signature on the pushed digest covers
      # every tag of this push. Gated like `push:` so it never runs unpushed.
      - name: Install cosign
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "${IMAGE}@${DIGEST}"

      # GitHub-native provenance attestation (Attestations tab, `gh attestation
      # verify`), stored alongside the image in ghcr.
      - name: Attest build provenance
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The GitHub release for the tag. Runs only after the image is pushed, signed
  # and attested: releases are immutable org-wide (a published release reserves
  # its tag forever), so a failed build must never leave one behind. Notes are
  # the tag's CHANGELOG.md section plus the image digest and verify commands;
  # the one asset is an SPDX SBOM of that digest (syft), in addition to the
  # BuildKit SBOM attestation already attached to the image.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # create the release
      packages: read    # syft pulls the image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          # the tag's section without its heading, blank lines around it trimmed
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md \
            | sed -e '1{/^$/d}' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## [$v]' section"; exit 1; }
          cat >> notes.md <<EOF

          ### Image

          ~~~
          ${IMAGE}:${TAG}
          ${IMAGE}@${DIGEST}
          ~~~

          Signed keyless with cosign and attested by GitHub Actions. Verify with

          ~~~
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${REPO}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${REPO}
          ~~~

          The attached SPDX file is the SBOM of this digest (syft). The BuildKit
          SBOM and provenance attestations are attached to the image itself.
          EOF

      - name: SBOM of the pushed image (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ needs.build-push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ github.event.repository.name }}-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086  # $pre is an optional flag
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $pre "${NAME}-${TAG}.spdx.json"
