# NATS server config with worker enrollment (auth-callout). Core admits each
# worker connection and places it, scoped to its provider, in the CAIRN account.
#
# Setup:
#   1. POST /api/admin/nats/bootstrap-account-key on core; export the returned
#      public key as CAIRN_NATS_AUTH_ISSUER for nats-server (or paste it below).
#   2. Export CAIRN_NATS_PASSWORD for nats-server and core alike.
#   3. Core: CAIRN_NATS_USERNAME=cairn-core, CAIRN_NATS_PASSWORD,
#      CAIRN_NATS_AUTH_CALLOUT=true, CAIRN_NATS_WORKER_ACCOUNT=CAIRN.
#   4. Workers: CAIRN_WORKER_ENROLLMENT_TOKEN from POST /api/admin/worker-enrollments.
# Values starting with $ are read from nats-server's environment.

http_port: 8222

jetstream {
  store_dir: "/data"
}

# See docker/nats.conf.
max_payload: 8MB

accounts {
  CAIRN {
    jetstream: enabled
    users: [
      # Core itself; listed in auth_users, so it bypasses the callout.
      { user: cairn-core, password: $CAIRN_NATS_PASSWORD }
    ]
  }
}

authorization {
  auth_callout {
    issuer: $CAIRN_NATS_AUTH_ISSUER
    account: CAIRN
    auth_users: [ cairn-core ]
  }
}
