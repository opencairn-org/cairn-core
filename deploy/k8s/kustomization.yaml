apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cairn

# secrets.yaml is intentionally NOT listed — copy secrets.example.yaml to
# secrets.yaml, fill it in, and either apply it separately or add it here.
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - nats.yaml
  - minio.yaml
  - migrate-job.yaml
  - core.yaml
  - worker-strava.yaml
  - worker-garmin.yaml
  - ingress.yaml

# Pin every Cairn image tag in one place. Override the registry/tag here
# (or with `kustomize edit set image ...`) instead of editing each manifest.
images:
  - name: ghcr.io/opencairn-org/cairn-core
    newTag: v0.7.4@sha256:67173f8bf6ab6c6dfdda5c256fe0628b7d44c30940ee3c7e315250abe89dd18c
  - name: ghcr.io/opencairn-org/cairn-provider-strava
    newTag: v0.7.2@sha256:8dfde66d74d47ca841a6806e0e1a4a86289519c6c04dd5092e7939600bf94bd6
  - name: ghcr.io/opencairn-org/cairn-provider-garmin
    newTag: v0.7.1@sha256:2d6108d270bc95a50ecc0fb365045379578c2832db754f0d9243ffc415027440
