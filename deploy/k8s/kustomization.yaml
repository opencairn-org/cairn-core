apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cairn

# secrets.yaml is intentionally NOT listed — copy secrets.example.yaml to
# secrets.yaml, fill it in, and either apply it separately or add it here.
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - nats.yaml
  - minio.yaml
  - migrate-job.yaml
  - core.yaml
  - worker-strava.yaml
  - worker-garmin.yaml
  - ingress.yaml

# Pin every Cairn image tag in one place. Override the registry/tag here
# (or with `kustomize edit set image ...`) instead of editing each manifest.
images:
  - name: ghcr.io/opencairn-org/cairn-core
    newTag: v0.2.6
  - name: ghcr.io/opencairn-org/cairn-provider-strava
    newTag: v0.5.0@sha256:c3d724cafd0a2fa5f7425cde302603cf659f7d707affb67f3889e0a682b6fc49
  - name: ghcr.io/opencairn-org/cairn-provider-garmin
    newTag: v0.2.2
